name: rust-backend

services:
  mysql:
    image: mysql:8.4.13
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:8.10.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.19.7
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9200/_cluster/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 3000
      RUST_LOG: ${RUST_LOG:-backend_api=info,tower_http=info}
      HEALTH_CHECK_TIMEOUT_MS: ${HEALTH_CHECK_TIMEOUT_MS:-2000}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}
      APP_ENV: ${APP_ENV:-development}
      SERVICE_NAME: ${SERVICE_NAME:-school-api}
      HTTP_HTTPS_ENABLED: ${HTTP_HTTPS_ENABLED:-false}
      HTTP_HSTS_MAX_AGE_SECS: ${HTTP_HSTS_MAX_AGE_SECS:-31536000}
      HTTP_MAX_BODY_BYTES: ${HTTP_MAX_BODY_BYTES:-1048576}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      # The metrics port is intentionally not published; scrape it over the Compose network.
      METRICS_ADDR: 0.0.0.0:9090
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-local-dev-metrics-token}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      CORS_ALLOWED_METHODS: ${CORS_ALLOWED_METHODS:-GET,POST,PUT,PATCH,DELETE,OPTIONS}
      CORS_ALLOWED_HEADERS: ${CORS_ALLOWED_HEADERS:-authorization,content-type,x-request-id}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-false}
      CORS_MAX_AGE_SECS: ${CORS_MAX_AGE_SECS:-600}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_GENERAL_IP_CAPACITY: ${RATE_LIMIT_GENERAL_IP_CAPACITY:-120}
      RATE_LIMIT_GENERAL_IP_REFILL_PER_MINUTE: ${RATE_LIMIT_GENERAL_IP_REFILL_PER_MINUTE:-120}
      RATE_LIMIT_AUTH_IP_CAPACITY: ${RATE_LIMIT_AUTH_IP_CAPACITY:-10}
      RATE_LIMIT_AUTH_IP_REFILL_PER_MINUTE: ${RATE_LIMIT_AUTH_IP_REFILL_PER_MINUTE:-6}
      RATE_LIMIT_AUTH_ACCOUNT_CAPACITY: ${RATE_LIMIT_AUTH_ACCOUNT_CAPACITY:-5}
      RATE_LIMIT_AUTH_ACCOUNT_REFILL_PER_MINUTE: ${RATE_LIMIT_AUTH_ACCOUNT_REFILL_PER_MINUTE:-1}
      RATE_LIMIT_FALLBACK_MAX_ENTRIES: ${RATE_LIMIT_FALLBACK_MAX_ENTRIES:-10000}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-604800}
      REFRESH_FAMILY_MAX_LIFETIME_SECONDS: ${REFRESH_FAMILY_MAX_LIFETIME_SECONDS:-2592000}
      COURSE_CACHE_DETAIL_TTL_SECONDS: ${COURSE_CACHE_DETAIL_TTL_SECONDS:-300}
      COURSE_CACHE_LIST_TTL_SECONDS: ${COURSE_CACHE_LIST_TTL_SECONDS:-60}
      COURSE_CACHE_NEGATIVE_TTL_SECONDS: ${COURSE_CACHE_NEGATIVE_TTL_SECONDS:-30}
      DATABASE_URL: mysql://${MYSQL_USER:-app}:${MYSQL_PASSWORD:-app}@mysql:3306/${MYSQL_DATABASE:-app}
      DATABASE_MIN_CONNECTIONS: ${DATABASE_MIN_CONNECTIONS:-0}
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-10}
      DATABASE_CONNECT_TIMEOUT_MS: ${DATABASE_CONNECT_TIMEOUT_MS:-2000}
      DATABASE_ACQUIRE_TIMEOUT_MS: ${DATABASE_ACQUIRE_TIMEOUT_MS:-2000}
      DATABASE_QUERY_TIMEOUT_MS: ${DATABASE_QUERY_TIMEOUT_MS:-5000}
      DATABASE_TLS_MODE: ${DATABASE_TLS_MODE:-disabled}
      DATABASE_TLS_CA_PATH: ${DATABASE_TLS_CA_PATH:-}
      REDIS_URL: redis://redis:6379
      REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-2000}
      REDIS_COMMAND_TIMEOUT_MS: ${REDIS_COMMAND_TIMEOUT_MS:-1000}
      REDIS_TLS_MODE: ${REDIS_TLS_MODE:-disabled}
      OPENSEARCH_URL: http://opensearch:9200
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_started
      opensearch:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10
    # Must exceed SHUTDOWN_TIMEOUT_MS plus pool-close time, or Docker SIGKILLs mid-drain.
    stop_grace_period: 15s
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  opensearch-data:

