[workspace]
members = ["crates/api", "migration"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
dotenvy = "0.15"
http-body-util = "0.1"
opensearch = { version = "2.4", default-features = false, features = ["native-tls"] }
redis = { version = "1.0", features = ["tokio-comp", "connection-manager"] }
sea-orm = { version = "1.1", default-features = false, features = ["macros", "runtime-tokio-native-tls", "sqlx-mysql"] }
sea-orm-migration = { version = "1.1", default-features = false, features = ["cli", "runtime-tokio-native-tls", "sqlx-mysql"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.0", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
uuid = { version = "1.0", features = ["v7"] }

